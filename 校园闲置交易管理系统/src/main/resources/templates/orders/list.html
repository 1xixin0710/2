<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('我的订单')}"></head>
<body class="app-page">
<header th:replace="~{fragments :: app-header('orders')}"></header>
<main class="app-main">
    <div th:replace="~{fragments :: flash}"></div>

    <section class="page-heading">
        <div>
            <p class="breadcrumb">大工校园二手 / 我的订单</p>
            <h1>我的订单</h1>
            <p class="page-summary">查看已下单物品、付款状态和交易进度。</p>
        </div>
        <a class="button button-primary" th:href="@{/items}"><i data-lucide="search"></i> 继续逛闲置</a>
    </section>

    <div class="empty-state" th:if="${#lists.isEmpty(orders)}">
        <span><i data-lucide="receipt-text"></i></span>
        <h2>还没有订单</h2>
        <p>在物品详情页点击“立即购买”，即可生成订单。</p>
        <a class="button button-secondary button-sm" th:href="@{/items}">查看在售物品</a>
    </div>

    <section class="order-list" th:unless="${#lists.isEmpty(orders)}">
        <article class="order-card" th:each="order : ${orders}">
            <div class="order-card-head">
                <span th:text="${'订单号 ' + order.orderNo}">订单号 CM20261025</span>
                <span class="order-status"
                      th:classappend="${order.status == '待付款' ? 'is-pending' : (order.status == '已付款' ? 'is-paid' : (order.status == '已完成' ? 'is-done' : 'is-cancelled'))}"
                      th:text="${order.status}">待付款</span>
            </div>
            <div class="order-card-body">
                <img th:src="${order.itemImageUrl}" th:alt="${order.itemTitle}">
                <div class="order-card-copy">
                    <h2 th:text="${order.itemTitle}">物品名称</h2>
                    <p th:text="${order.deliveryMethod + ' · ' + order.tradeLocation + ' · ' + order.paymentMethod}">自提 · 学苑书院 · 当面付款</p>
                    <time th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">2026-10-25 18:00</time>
                </div>
                <strong class="order-card-amount" th:text="${'¥ ' + #numbers.formatDecimal(order.amount, 1, 2)}">¥ 0.00</strong>
                <a class="button button-secondary button-sm" th:href="@{/orders/{id}(id=${order.id})}">查看订单</a>
            </div>
        </article>
    </section>
</main>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
